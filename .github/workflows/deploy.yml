# Audit — browser-only: no Python runtime, no Functions.
# Checks: generated catalog drift + parity + rendered contrast, then deploys.
name: Audit checks & deploy

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'audit_logic.js'
      - 'catalog.js'
      - 'kinds.js'
      - 'palette.css'
      - 'consent.css'
      - 'consent.js'
      - 'analytics.js'
      - 'config.js.example'
      - 'skus.json'
      - 'sort.js'
      - 'site.webmanifest'
      - 'robots.txt'
      - 'sitemap.xml'
      - 'staticwebapp.config.json'
      - 'tools/**'
      - 'fixtures/**'
      - 'e2e/**'
      - 'package.json'
      - 'package-lock.json'
      - 'playwright.config.js'
      - '.github/workflows/deploy.yml'
  pull_request:
    branches: [main]
    paths:
      - 'index.html'
      - 'audit_logic.js'
      - 'catalog.js'
      - 'kinds.js'
      - 'palette.css'
      - 'consent.css'
      - 'consent.js'
      - 'analytics.js'
      - 'config.js.example'
      - 'skus.json'
      - 'sort.js'
      - 'site.webmanifest'
      - 'robots.txt'
      - 'sitemap.xml'
      - 'staticwebapp.config.json'
      - 'tools/**'
      - 'fixtures/**'
      - 'e2e/**'
      - 'package.json'
      - 'package-lock.json'
      - 'playwright.config.js'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  checks:
    runs-on: ubuntu-latest
    name: Drift, parity & contrast
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: '3.13' }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Catalog drift gate
        run: python tools/sync_catalog.py --check

      # The audit origin must serve its crawler files as files, not as the SPA
      # index. Allow is an owner decision recorded on ebbwater/wantnot#158.
      - name: Crawler files (robots and sitemap)
        run: python tools/robots_check.py

      # Social-preview metadata (#7): a relative og:image or a missing og:url
      # renders a bare share card and is invisible in a browser.
      - name: Social metadata (og image and url)
        run: python tools/social_meta_check.py

      # Asserts the browser analyzer matches the backend contract snapshot —
      # finding keys, seats, money, confidence, waste totals, warning semantics.
      # Runs the Node runner internally; the snapshot is fixtures/parity_expected.json,
      # generated by tools/parity_snapshot.py in kylernunan/wantnot and synced nightly.
      - name: Parity — browser vs backend contract
        run: python tools/parity_check.py

      - name: Install locked browser test dependencies
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium

      # Gate deploy on the real import UI and both rendered themes. Token
      # ratios alone cannot see blended badges or selected legend text.
      - name: Rendered contrast — initial page and CSV report
        run: npm run test:contrast

      # The analytics configured cases must run against a SERVED CSP header.
      # `connect-src` is a document response header, so configuring a site id by
      # stubbing config.js cannot exercise the launch path: the served document
      # keeps its inert CSP, the beacon is refused, and the case passes only on a
      # static server that sends no header at all. This asserts the fixture that
      # prevents that is still wired.
      - name: Analytics configured cases run against a served CSP
        run: python tools/analytics_wiring_check.py --root .

      # config.js must stay a placeholder in the repo — the real client ID is
      # injected at deploy time. A GUID-shaped value committed here means someone
      # exported their working config; catch it before it reaches public history.
      - name: config.js stays placeholder
        run: |
          set -euo pipefail
          if grep -Eq "[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}" config.js; then
            echo "::error::config.js contains a GUID — the real client ID is injected at deploy; revert to the placeholder"
            exit 1
          fi
          echo "config.js is a placeholder (client ID injected at deploy)"

  deploy:
    # SWA needs a secret; forks and Dependabot run without it — skip deploy cleanly rather than fail.
    if: github.event_name != 'pull_request' || github.event.action != 'closed'
    needs: checks
    runs-on: ubuntu-latest
    name: Build and deploy (audit.wantnot.ebbwater.net)
    outputs:
      preview_url: ${{ steps.swa.outputs.static_web_app_url }}
    steps:
      - uses: actions/checkout@v7
        with: { submodules: false, lfs: false }

      - name: Inject config.js from secret (audit app only)
        env:
          AUDIT_CLIENT_ID: ${{ secrets.AUDIT_CLIENT_ID }}
          AUDIT_API_BASE: ${{ secrets.AUDIT_API_BASE }}
        run: |
          set -euo pipefail
          if [ -z "${AUDIT_CLIENT_ID:-}" ]; then
            echo "AUDIT_CLIENT_ID not set — leaving placeholder config.js (fork/Dependabot skips deploy)"
          else
            API_BASE="${AUDIT_API_BASE:-https://func-wantnot-4dc52f.azurewebsites.net}"
            # Analytics (GTM W3) ships inert: both values empty means no beacon,
            # no request and no vendor code. Launching is these two values plus
            # the CSP step below, which derives the grant from this same file.
            ANALYTICS_PROVIDER=""
            ANALYTICS_SITE=""
            cat > config.js <<JSCONFIG
          /* Generated at deploy — do not commit. WANTNOT_AUDIT_CLIENT_ID is a public identifier, not a secret; this app is a public client with no secret. */
          window.WANTNOT_AUDIT_CLIENT_ID = '${AUDIT_CLIENT_ID}';
          window.WANTNOT_API_BASE = '${API_BASE}';
          window.WANTNOT_ANALYTICS = { provider: '${ANALYTICS_PROVIDER}', site: '${ANALYTICS_SITE}' };
          JSCONFIG
            echo "config.js injected (API base ${API_BASE})"
          fi
          grep -q "WANTNOT_AUDIT_CLIENT_ID" config.js || { echo "::error::config.js missing WANTNOT_AUDIT_CLIENT_ID"; exit 1; }
          grep -q "WANTNOT_ANALYTICS" config.js || { echo "::error::config.js missing WANTNOT_ANALYTICS"; exit 1; }

      # The analytics connect-src grant is derived here, from the config.js this
      # job just wrote. Validation runs FIRST, so a bad configuration fails the
      # deploy before anything is rewritten: an unknown provider refuses rather
      # than shipping a beacon the CSP would block with no error anyone watches.
      - name: Validate analytics configuration (fails before any rewrite)
        run: python tools/analytics_csp.py --root .

      # With no site id this writes nothing and the deployed CSP is
      # byte-identical to the committed one; with a site id it adds exactly that
      # one provider origin to connect-src and never touches script-src.
      - name: Apply analytics CSP grant (no-op unless a site id is set)
        run: python tools/analytics_csp.py --root . --write

      - name: Verify the analytics CSP outcome matches the configured state
        run: python tools/analytics_csp.py --root . --verify

      - name: Check assets present
        run: |
          set -euo pipefail
          for f in index.html audit_logic.js catalog.js kinds.js palette.css sort.js site.webmanifest robots.txt sitemap.xml consent.css consent.js analytics.js; do
            test -f "$f" || { echo "::error::$f missing"; exit 1; }
          done
          # index.html must load config.js before the inline script (same trap as wantnot)
          grep -Eq '<script[^>]+src=.?config[.]js' index.html || { echo "::error::index.html does not load config.js"; exit 1; }
          # The consent seam must be live before the hook reads it, and config.js
          # must be set before both. A page that loads the hook without the seam
          # ships a beacon that can never fire, and says so only in a state value
          # no operator is reading.
          python tools/analytics_csp.py --root . --verify-wiring

      - name: Deploy to Static Web Apps
        id: swa
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_AUDIT }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: '.'
          skip_app_build: true
          skip_deploy_on_missing_secrets: true

  preview_contrast:
    needs: deploy
    # Forks without a deployment secret still run the blocking local browser
    # checks above. A real preview also tests the bytes returned by SWA.
    if: github.event_name == 'pull_request' && needs.deploy.outputs.preview_url != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    name: Contrast (deployed preview)
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Install locked browser test dependencies
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Check both themes and CSV report on the preview
        env:
          PREVIEW_URL: ${{ needs.deploy.outputs.preview_url }}
        run: npm run test:contrast

  close_preview:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Tear down PR preview
    steps:
      - uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_AUDIT }}
          action: close
